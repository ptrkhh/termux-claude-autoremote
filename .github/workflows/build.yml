name: Build

on:
  push:
    paths:
      - "android/**"
      - "bin/**"
      - "scripts/**"
      - "shortcuts-Claude"
      - ".github/workflows/build.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk open-claude-code-here.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-claude-code-here-apk
          path: open-claude-code-here.apk

      # When a GitHub release is published, attach the APK so it can be
      # downloaded directly onto the phone.
      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: open-claude-code-here.apk

  # The setup one-liner curls install.sh from the latest release, so that asset
  # has to be built from the same commit as the launcher it embeds.
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build install.sh
        run: |
          bash scripts/build-installer.sh > install.sh
          bash -n install.sh

      - name: Check the embedded launcher round-trips
        run: |
          grep -oP "(?<=printf '%s' ')[A-Za-z0-9+/=]+(?=')" install.sh \
            | head -1 | base64 -d > launcher.out
          diff launcher.out bin/claude-launch

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: install-sh
          path: install.sh

      - name: Attach install.sh to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: install.sh

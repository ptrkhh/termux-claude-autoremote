name: Build

on:
  push:
    paths:
      - "android/**"
      - "bin/**"
      - "install.sh"
      - ".github/workflows/build.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk open-claude-code-here.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-claude-code-here-apk
          path: open-claude-code-here.apk

      # Publishing a release is what makes a new setup live: the one-liner curls
      # install.sh from the latest release, and install.sh curls claude-launch
      # from the same place, so both always come from the same published tag.
      - name: Attach release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            open-claude-code-here.apk
            install.sh
            bin/claude-launch

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check the shell
        run: bash -n install.sh bin/claude-launch

      - name: Run the launcher's selftest
        run: bash bin/claude-launch --selftest

      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck install.sh bin/claude-launch

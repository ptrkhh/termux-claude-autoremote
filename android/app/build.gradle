plugins {
    id "com.android.application"
}

android {
    namespace "com.ptrkhh.openclaudehere"
    compileSdk 34

    defaultConfig {
        applicationId "com.ptrkhh.openclaudehere"
        minSdk 21
        targetSdk 34
        // Bump versionCode on every released APK — Android treats an unchanged
        // code as the same build, so sideloading over an old install is not
        // reliably an upgrade. versionName tracks the release tag.
        versionCode 3
        versionName "2.0.0"
    }

    // The debug build is what gets sideloaded — signed with the standard debug
    // key so it installs without any signing setup. No release signing config
    // is needed for a personal share-target helper.
    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
